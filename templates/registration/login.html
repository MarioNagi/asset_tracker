{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in | Koinonia Asset Tracker</title>
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}?v=5.3.3">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}?v=20260812-ui2">
</head>
<body class="login-page">
    <main class="login-shell">
        <div class="login-brand">
            <span class="brand-mark"><img src="{% static 'images/logo.png' %}" alt="" width="38" height="38"></span>
            <span><strong>Koinonia</strong><small>Asset Tracker</small></span>
        </div>
        <div class="card login-card">
            <div class="card-body">
                <div class="text-center mb-4">
                    <span class="metric-icon mx-auto mb-3"><i class="fas fa-lock"></i></span>
                    <h1 class="mb-2">Welcome back</h1>
                    <p class="text-muted mb-0">Sign in to manage company assets securely.</p>
                </div>
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="{{ form.login.id_for_label }}" class="form-label">Username</label>
                        <input type="text" id="{{ form.login.id_for_label }}" name="{{ form.login.html_name }}" class="form-control" value="{{ form.login.value|default:'' }}" placeholder="Enter your username" autocomplete="username" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label for="{{ form.password.id_for_label }}" class="form-label">Password</label>
                        <input type="password" id="{{ form.password.id_for_label }}" name="{{ form.password.html_name }}" class="form-control" placeholder="Enter your password" autocomplete="current-password" required>
                    </div>
                    {% if form.errors %}<div class="alert alert-danger"><i class="fas fa-circle-exclamation me-1"></i> Invalid username or password.</div>{% endif %}
                    <button type="submit" class="btn btn-primary btn-lg w-100"><i class="fas fa-arrow-right-to-bracket me-1"></i> Sign in</button>
                </form>
                <p class="text-center mt-4 mb-0 small">Forgot your password? <a href="{% url 'password_reset' %}" class="fw-semibold">Reset it here</a></p>
            </div>
        </div>
    </main>
</body>
</html>
